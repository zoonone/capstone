<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="mysql" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67b7ff"/>
      <stop offset="100%" stop-color="#1976d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16324f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#36536b"/>
    </marker>
    <style>
      .title { font: 700 36px 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif; fill: #16324f; }
      .subtitle { font: 500 20px 'SF Pro Text', 'Apple SD Gothic Neo', sans-serif; fill: #59708a; }
      .label { font: 700 26px 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif; fill: #16324f; }
      .emoji { font: 400 34px 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; }
      .small { font: 600 22px 'SF Pro Text', 'Apple SD Gothic Neo', sans-serif; fill: #16324f; }
      .small-emoji { font: 400 28px 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; }
      .line { stroke: #36536b; stroke-width: 8; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .box { fill: #ffffff; stroke: #c9d8ea; stroke-width: 3; rx: 28; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1420" cy="130" r="120" fill="#dcecff"/>
  <circle cx="220" cy="780" r="160" fill="#e6f1ff"/>

  <text x="110" y="100" class="title">Backend Request Flow</text>
  <text x="110" y="140" class="subtitle">Client request, security filter, service layer, and MySQL persistence</text>

  <rect x="100" y="220" width="220" height="110" rx="28" class="box"/>
  <text x="145" y="287" class="emoji">💻</text>
  <text x="190" y="287" class="label">Client</text>

  <rect x="420" y="220" width="260" height="110" rx="28" class="box"/>
  <text x="467" y="287" class="emoji">🧭</text>
  <text x="512" y="287" class="label">Controller</text>

  <rect x="780" y="220" width="220" height="110" rx="28" class="box"/>
  <text x="830" y="287" class="emoji">⚙️</text>
  <text x="880" y="287" class="label">Service</text>

  <rect x="780" y="520" width="280" height="110" rx="28" class="box"/>
  <text x="830" y="587" class="emoji">🗄️</text>
  <text x="880" y="587" class="label">Repository</text>

  <g filter="url(#shadow)">
    <ellipse cx="1290" cy="555" rx="120" ry="34" fill="#8dc8ff" stroke="#1565c0" stroke-width="3"/>
    <rect x="1170" y="555" width="240" height="88" fill="url(#mysql)" stroke="#1565c0" stroke-width="3"/>
    <ellipse cx="1290" cy="643" rx="120" ry="34" fill="#1565c0" stroke="#1565c0" stroke-width="3"/>
    <ellipse cx="1290" cy="555" rx="120" ry="34" fill="none" stroke="#d8efff" stroke-width="3"/>
  </g>
  <text x="1230" y="608" font-family="'SF Pro Display', 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#ffffff">MySQL</text>

  <rect x="100" y="430" width="330" height="96" rx="24" class="box"/>
  <text x="150" y="490" class="small-emoji">🔐</text>
  <text x="200" y="490" class="small">Security / JWT Filter</text>

  <rect x="510" y="430" width="240" height="96" rx="24" class="box"/>
  <text x="560" y="490" class="small-emoji">🧭</text>
  <text x="610" y="490" class="small">Controller</text>

  <path d="M320 275 L420 275" class="line"/>
  <path d="M680 275 L780 275" class="line"/>
  <path d="M890 330 L890 505" class="line"/>
  <path d="M1060 575 L1160 575" class="line"/>
  <path d="M265 330 L265 410" class="line"/>
  <path d="M430 478 L510 478" class="line"/>

  <text x="112" y="730" class="subtitle">Diagram</text>
  <text x="110" y="772" class="small">[ 💻 Client ] → [ 🧭 Controller ] → [ ⚙️ Service ]</text>
  <text x="110" y="810" class="small">                                 ↓</text>
  <text x="110" y="848" class="small">                    [ 🗄️ Repository ] → [ 🛢️ MySQL ]</text>
</svg>
