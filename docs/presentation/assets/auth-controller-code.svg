<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 38px 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; fill: #102a43; }
      .code { font: 24px Menlo, Monaco, monospace; fill: #e2e8f0; }
      .num { font: 24px Menlo, Monaco, monospace; fill: #64748b; }
      .hl { fill: #38bdf8; font-weight: 700; }
      .tx { fill: #f8fafc; }
      .st { fill: #86efac; }
      .cm { fill: #fbbf24; }
      .box { rx: 24; ry: 24; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fbff"/>
  <text x="80" y="85" class="title">실제 동작 코드: AuthController</text>
  <rect x="80" y="130" width="1440" height="690" fill="#0f172a" class="box"/>
  <text x="120" y="205" class="num">1</text><text x="170" y="205" class="code"><tspan class="hl">@PostMapping</tspan><tspan class="tx">("/signup")</tspan></text>
  <text x="120" y="255" class="num">2</text><text x="170" y="255" class="code"><tspan class="hl">public</tspan><tspan class="tx"> ResponseEntity&lt;String&gt; signup(</tspan><tspan class="hl">@Valid</tspan><tspan class="tx"> </tspan><tspan class="hl">@RequestBody</tspan><tspan class="tx"> SignupRequest request) {</tspan></text>
  <text x="120" y="305" class="num">3</text><text x="170" y="305" class="code"><tspan class="tx">    authService.signup(request);</tspan></text>
  <text x="120" y="355" class="num">4</text><text x="170" y="355" class="code"><tspan class="tx">    </tspan><tspan class="hl">return</tspan><tspan class="tx"> ResponseEntity.status(HttpStatus.CREATED).body(</tspan><tspan class="st">"회원가입 성공"</tspan><tspan class="tx">);</tspan></text>
  <text x="120" y="405" class="num">5</text><text x="170" y="405" class="code"><tspan class="tx">}</tspan></text>
  <text x="120" y="495" class="num">6</text><text x="170" y="495" class="code"><tspan class="hl">@PostMapping</tspan><tspan class="tx">("/login")</tspan></text>
  <text x="120" y="545" class="num">7</text><text x="170" y="545" class="code"><tspan class="hl">public</tspan><tspan class="tx"> ResponseEntity&lt;TokenResponse&gt; login(</tspan><tspan class="hl">@Valid</tspan><tspan class="tx"> </tspan><tspan class="hl">@RequestBody</tspan><tspan class="tx"> LoginRequest request) {</tspan></text>
  <text x="120" y="595" class="num">8</text><text x="170" y="595" class="code"><tspan class="tx">    </tspan><tspan class="hl">return</tspan><tspan class="tx"> ResponseEntity.ok(</tspan><tspan class="hl">new</tspan><tspan class="tx"> TokenResponse(authService.login(request)));</tspan></text>
  <text x="120" y="645" class="num">9</text><text x="170" y="645" class="code"><tspan class="tx">}</tspan></text>
  <text x="120" y="735" class="num">10</text><text x="170" y="735" class="code"><tspan class="cm">// 컨트롤러는 요청 검증과 응답 포맷에 집중</tspan></text>
</svg>
