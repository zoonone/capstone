  <text x="120" y="195" class="num">1</text><text x="170" y="195" class="code"><tspan class="hl">public</tspan><tspan> User signup(SignupRequest request) {</tspan></text>
  <text x="120" y="240" class="num">2</text><text x="170" y="240" class="code"><tspan>    </tspan><tspan class="hl">if</tspan><tspan> (userRepository.findByEmail(request.getEmail()).isPresent()) {</tspan></text>
  <text x="120" y="285" class="num">3</text><text x="170" y="285" class="code"><tspan>        </tspan><tspan class="hl">throw</tspan><tspan> </tspan><tspan class="hl">new</tspan><tspan> ConflictException(</tspan><tspan class="st">CREDENTIALS_FAILURE_MESSAGE</tspan><tspan>);</tspan></text>
  <text x="120" y="330" class="num">4</text><text x="170" y="330" class="code"><tspan>    }</tspan></text>
  <text x="120" y="375" class="num">5</text><text x="170" y="375" class="code"><tspan>    User user = User.builder()</tspan></text>
  <text x="120" y="420" class="num">6</text><text x="170" y="420" class="code"><tspan>        .email(request.getEmail())</tspan></text>
  <text x="120" y="465" class="num">7</text><text x="170" y="465" class="code"><tspan>        .password(passwordEncoder.encode(request.getPassword()))</tspan></text>
  <text x="120" y="510" class="num">8</text><text x="170" y="510" class="code"><tspan>        .name(request.getName())</tspan></text>
  <text x="120" y="555" class="num">9</text><text x="170" y="555" class="code"><tspan>        .build();</tspan></text>
  <text x="120" y="600" class="num">10</text><text x="170" y="600" class="code"><tspan>    </tspan><tspan class="hl">return</tspan><tspan> userRepository.save(user);</tspan></text>
  <text x="120" y="675" class="num">11</text><text x="170" y="675" class="code"><tspan class="hl">public</tspan><tspan> String login(LoginRequest request) {</tspan></text>
  <text x="120" y="720" class="num">12</text><text x="170" y="720" class="code"><tspan>    User user = userRepository.findByEmail(request.getEmail()) ...</tspan></text>
  <text x="120" y="765" class="num">13</text><text x="170" y="765" class="code"><tspan>    </tspan><tspan class="hl">return</tspan><tspan> jwtUtil.createToken(user.getEmail());</tspan><tspan class="cm"> // 토큰 발급</tspan></text>
