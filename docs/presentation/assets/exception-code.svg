<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 38px 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; fill: #102a43; }
      .code { font: 21px Menlo, Monaco, monospace; fill: #e2e8f0; }
      .num { font: 21px Menlo, Monaco, monospace; fill: #64748b; }
      .hl { fill: #38bdf8; font-weight: 700; }
      .st { fill: #86efac; }
      .cm { fill: #fbbf24; }
      .box { rx: 24; ry: 24; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fbff"/>
  <text x="80" y="85" class="title">실제 동작 코드: 예외 처리와 검증</text>
  <rect x="80" y="130" width="1440" height="690" fill="#0f172a" class="box"/>
  <text x="120" y="190" class="num">1</text><text x="170" y="190" class="code"><tspan class="hl">@ExceptionHandler</tspan><tspan>(MethodArgumentNotValidException.class)</tspan></text>
  <text x="120" y="235" class="num">2</text><text x="170" y="235" class="code"><tspan class="hl">public</tspan><tspan> ResponseEntity&lt;ErrorResponse&gt; handleValidationException(...) {</tspan></text>
  <text x="120" y="280" class="num">3</text><text x="170" y="280" class="code"><tspan>    boolean isAuthCredentialsError = request.getRequestURI().startsWith(</tspan><tspan class="st">"/api/auth/"</tspan><tspan>)</tspan></text>
  <text x="120" y="325" class="num">4</text><text x="170" y="325" class="code"><tspan>        &amp;&amp; ... anyMatch(field -&gt; </tspan><tspan class="st">"email"</tspan><tspan>.equals(...) || </tspan><tspan class="st">"password"</tspan><tspan>.equals(...));</tspan></text>
  <text x="120" y="370" class="num">5</text><text x="170" y="370" class="code"><tspan>    String message = isAuthCredentialsError ? </tspan><tspan class="st">INVALID_CREDENTIALS_MESSAGE</tspan><tspan> : ...;</tspan></text>
  <text x="120" y="415" class="num">6</text><text x="170" y="415" class="code"><tspan>    </tspan><tspan class="hl">return</tspan><tspan> buildErrorResponse(HttpStatus.BAD_REQUEST, message);</tspan></text>
  <text x="120" y="500" class="num">7</text><text x="170" y="500" class="code"><tspan class="hl">@NotBlank</tspan><tspan>(message = INVALID_CREDENTIALS_MESSAGE)</tspan></text>
  <text x="120" y="545" class="num">8</text><text x="170" y="545" class="code"><tspan class="hl">@Email</tspan><tspan>(message = INVALID_CREDENTIALS_MESSAGE)</tspan></text>
  <text x="120" y="590" class="num">9</text><text x="170" y="590" class="code"><tspan>private String email;</tspan></text>
  <text x="120" y="635" class="num">10</text><text x="170" y="635" class="code"><tspan class="hl">@Size</tspan><tspan>(min = 4, message = INVALID_CREDENTIALS_MESSAGE)</tspan></text>
  <text x="120" y="680" class="num">11</text><text x="170" y="680" class="code"><tspan>private String password;</tspan></text>
  <text x="120" y="760" class="num">12</text><text x="170" y="760" class="code"><tspan class="cm">// 잘못된 인증 정보는 항상 같은 메시지로 응답</tspan></text>
</svg>
