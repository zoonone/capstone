<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 38px 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; fill: #102a43; }
      .code { font: 21px Menlo, Monaco, monospace; fill: #e2e8f0; }
      .num { font: 21px Menlo, Monaco, monospace; fill: #64748b; }
      .hl { fill: #38bdf8; font-weight: 700; }
      .st { fill: #86efac; }
      .cm { fill: #fbbf24; }
      .box { rx: 24; ry: 24; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fbff"/>
  <text x="80" y="85" class="title">실제 동작 코드: 테스트</text>
  <rect x="80" y="130" width="1440" height="690" fill="#0f172a" class="box"/>
  <text x="120" y="190" class="num">1</text><text x="170" y="190" class="code"><tspan class="hl">@Test</tspan></text>
  <text x="120" y="235" class="num">2</text><text x="170" y="235" class="code"><tspan>void loginReturnsJwtForLocalUser() {</tspan></text>
  <text x="120" y="280" class="num">3</text><text x="170" y="280" class="code"><tspan>    when(userRepository.findByEmail(</tspan><tspan class="st">"user@example.com"</tspan><tspan>)).thenReturn(Optional.of(user));</tspan></text>
  <text x="120" y="325" class="num">4</text><text x="170" y="325" class="code"><tspan>    String token = authService.login(request);</tspan></text>
  <text x="120" y="370" class="num">5</text><text x="170" y="370" class="code"><tspan>    assertTrue(jwtUtil.validateToken(token));</tspan></text>
  <text x="120" y="415" class="num">6</text><text x="170" y="415" class="code"><tspan>    assertEquals(</tspan><tspan class="st">"user@example.com"</tspan><tspan>, jwtUtil.getEmail(token));</tspan></text>
  <text x="120" y="500" class="num">7</text><text x="170" y="500" class="code"><tspan class="hl">@Test</tspan></text>
  <text x="120" y="545" class="num">8</text><text x="170" y="545" class="code"><tspan>void loginReturnsBadRequestForInvalidPayload() throws Exception {</tspan></text>
  <text x="120" y="590" class="num">9</text><text x="170" y="590" class="code"><tspan>    mockMvc.perform(post(</tspan><tspan class="st">"/api/auth/login"</tspan><tspan>) ... )</tspan></text>
  <text x="120" y="635" class="num">10</text><text x="170" y="635" class="code"><tspan>        .andExpect(status().isBadRequest())</tspan></text>
  <text x="120" y="680" class="num">11</text><text x="170" y="680" class="code"><tspan>        .andExpect(jsonPath(</tspan><tspan class="st">"$.message"</tspan><tspan>).value(</tspan><tspan class="st">"이메일 혹은 비밀번호가 잘못되었습니다."</tspan><tspan>));</tspan></text>
  <text x="120" y="760" class="num">12</text><text x="170" y="760" class="code"><tspan class="cm">// 서비스 로직과 API 응답을 둘 다 검증</tspan></text>
</svg>
